version: '3.8'
name: agi-postiz

services:
  db:
    image: postgres:16-alpine
    container_name: agi_post_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-agi_post}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-agi_post}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agi_post_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agi_post_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - media_storage:/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agi_post_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
      - media_storage:/storage
    command: celery -A app.workers.celery_app.celery worker --loglevel=info -c 1

  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agi_post_beat
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
      - media_storage:/storage
    command: celery -A app.workers.celery_app.celery beat --loglevel=info

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      target: dev
    container_name: agi_post_dashboard
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/dashboard:/repo/apps/dashboard
      - /repo/apps/dashboard/node_modules
      - /repo/node_modules
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Server-side origin used by the dashboard's BFF routes/middleware to reach
      # the api container directly over the Docker network.
      - API_INTERNAL_URL=http://api:8000

  # myAGI: gateway WhatsApp in casa (WAHA, Apache-2.0, motore NOWEB senza
  # browser). Un numero WhatsApp normale si collega via QR dalla pagina
  # "myAGI" della dashboard e diventa un canale whatsapp_myagi
  # dell'Omnichannel Responder - vedi docs/OMNICHANNEL_RESPONDER.md.
  # Nessuna porta pubblicata: ci parla solo l'API sulla rete Docker, con la
  # chiave MYAGI_WA_API_KEY. Le sessioni (le "credenziali" del telefono
  # collegato) vivono nel volume: senza, ogni riavvio richiede un nuovo QR.
  myagi_wa:
    image: devlikeapro/waha:noweb
    container_name: agi_post_myagi_wa
    restart: always
    environment:
      - WAHA_API_KEY=${MYAGI_WA_API_KEY}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_PRINT_QR=false
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - WAHA_BASE_URL=http://myagi_wa:3000
      - WAHA_DASHBOARD_ENABLED=false
      - WHATSAPP_SWAGGER_ENABLED=false
    volumes:
      - myagi_sessions:/app/.sessions

  nginx:
    image: nginx:1.25-alpine
    container_name: agi_post_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
      - dashboard
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_storage:/storage:ro

volumes:
  myagi_sessions:
  postgres_data:
  redis_data:
  media_storage:
