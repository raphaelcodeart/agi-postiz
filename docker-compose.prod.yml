version: '3.8'
name: agi-postiz

services:
  db:
    image: postgres:16-alpine
    container_name: agi_post_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agi_post_redis_prod
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # api, worker and beat run the SAME code with different commands, so they
    # share ONE image. They used to declare three separate build blocks, which
    # produced three separate images - and rebuilding only one of them (e.g.
    # `docker compose build api`) left the worker executing stale code while
    # everything looked deployed. The worker is what actually publishes, so that
    # failure is invisible until a campaign misbehaves. One image, one build,
    # no way for them to drift apart.
    image: agi-postiz-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agi_post_api_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - media_storage_prod:/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    # Same image as api - see the note there. No build block on purpose: it must
    # not be possible to build this service separately and have it drift.
    image: agi-postiz-api
    container_name: agi_post_worker_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - media_storage_prod:/storage
    command: celery -A app.workers.celery_app.celery worker --loglevel=warning -c 4

  beat:
    # Same image as api - see the note there. No build block on purpose: it must
    # not be possible to build this service separately and have it drift.
    image: agi-postiz-api
    container_name: agi_post_beat_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - media_storage_prod:/storage
    command: celery -A app.workers.celery_app.celery beat --loglevel=warning

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      target: production
    container_name: agi_post_dashboard_prod
    restart: always
    depends_on:
      - api
    env_file:
      - .env
    environment:
      # Server-side origin used by the dashboard's BFF routes/middleware to reach
      # the api container directly over the Docker network.
      - API_INTERNAL_URL=http://api:8000

  # myAGI: gateway WhatsApp in casa (WAHA, Apache-2.0, motore NOWEB senza
  # browser). Un numero WhatsApp normale si collega via QR dalla pagina
  # "myAGI" della dashboard e diventa un canale whatsapp_myagi
  # dell'Omnichannel Responder - vedi docs/OMNICHANNEL_RESPONDER.md.
  # Nessuna porta pubblicata: ci parla solo l'API sulla rete Docker, con la
  # chiave MYAGI_WA_API_KEY. Le sessioni (le "credenziali" del telefono
  # collegato) vivono nel volume: senza, ogni riavvio richiede un nuovo QR.
  myagi_wa:
    image: devlikeapro/waha:noweb
    container_name: agi_post_myagi_wa_prod
    restart: always
    environment:
      - WAHA_API_KEY=${MYAGI_WA_API_KEY}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_PRINT_QR=false
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - WAHA_BASE_URL=http://myagi_wa:3000
      - WAHA_DASHBOARD_ENABLED=false
      - WHATSAPP_SWAGGER_ENABLED=false
    volumes:
      - myagi_sessions_prod:/app/.sessions

  nginx:
    image: nginx:1.25-alpine
    container_name: agi_post_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - dashboard
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_storage_prod:/storage:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

  # Not a long-running service: invoked on demand via
  # `docker compose -f docker-compose.prod.yml run --rm certbot ...`
  # by scripts/setup-https.sh (initial issuance and renewal). See docs/DEPLOYMENT.md section 9.
  certbot:
    image: certbot/certbot:latest
    container_name: agi_post_certbot_prod
    command: ["--version"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  myagi_sessions_prod:
  postgres_data_prod:
  redis_data_prod:
  media_storage_prod:
  certbot_www:
  certbot_conf:
